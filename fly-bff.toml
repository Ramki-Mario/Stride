# Fly.io configuration for STRIDE.BFF
# Deploy: flyctl deploy --config fly-bff.toml
#
# Public ingress on api.strydesuite.com.
# Calls the Host via Fly private networking (stride-host.internal) — no
# Host traffic leaves the Fly.io network.
app            = "stride-bff"
primary_region = "iad"

[build]
  dockerfile    = "docker/stride-bff/Dockerfile"
  build-context = "."

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1

[http_service.concurrency]
  type       = "requests"
  soft_limit = 200
  hard_limit = 250

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[env]
  ASPNETCORE_ENVIRONMENT   = "Production"
  ASPNETCORE_URLS          = "http://+:8080"
  # Host is private — BFF connects via Fly internal DNS, never public internet
  SERVICES__STRIDEHOST     = "http://stride-host.internal:8080"
  # Secrets (set via: flyctl secrets set --app stride-bff KEY=value)
  # REDIS__CONNECTIONSTRING  — Upstash Redis TLS connection string
  # CORS__SPAORIGIN          — https://app.strydesuite.com

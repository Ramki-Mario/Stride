# Fly.io configuration for STRIDE.BFF
# Deploy: flyctl deploy --config fly-bff.toml
app            = "stride-bff"
primary_region = "iad"

[build]
  dockerfile    = "docker/stride-bff/Dockerfile"
  build-context = "."

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1   # keep 1 alive — within the 3-VM free allowance

[http_service.concurrency]
  type       = "requests"
  soft_limit = 200
  hard_limit = 250

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:8080"
  # Secrets (set via: flyctl secrets set --app stride-bff KEY=value)
  # SERVICES__STRIDEHOST       — e.g. https://stride-host.fly.dev
  # REDIS__CONNECTIONSTRING    — Upstash Redis connection string
  # SESSION__SECRET            — random 32+ char string for cookie signing
  # CORS__SPAORIGIN            — Vercel URL, e.g. https://stride.vercel.app

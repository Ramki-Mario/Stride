# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=Ramki-Mario_Stride
#
# This file is read by the SonarScanner during CI analysis.
# Secrets (sonar.token) are injected via GitHub Actions secrets — never committed.

sonar.projectKey=Ramki-Mario_Stride
sonar.organization=ramki-mario

# ── Project metadata ──────────────────────────────────────────────────────────
sonar.projectName=STRIDE
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────────────────────────
# Include backend src + frontend src; exclude generated files and test projects.
sonar.sources=backend/src,frontend/src
sonar.exclusions=\
  **/obj/**,\
  **/bin/**,\
  **/*.Designer.cs,\
  **/*ModelSnapshot.cs,\
  **/Migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.mock.ts

# ── Test sources ──────────────────────────────────────────────────────────────
sonar.tests=backend/tests
sonar.test.inclusions=**/*.Tests/**/*.cs

# ── C# / .NET ─────────────────────────────────────────────────────────────────
sonar.cs.opencover.reportsPaths=backend/TestResults/**/coverage.opencover.xml
# Also accept Cobertura (generated by our CI)
sonar.cs.cobertura.reportsPaths=backend/TestResults/**/coverage.cobertura.xml
sonar.cs.vstest.reportsPaths=backend/TestResults/**/*.trx

# ── TypeScript / Angular ──────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Enforce on new code: 80% coverage on changed lines, 0 new bugs, 0 new vulnerabilities
# Configure in SonarCloud UI: Project → Quality Gate → Edit

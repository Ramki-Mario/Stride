name: CI

# Fast feedback on every push/PR:
# - Build + test on Linux (cheaper runner, faster feedback)
# - Generate HTML coverage report and upload as artifact
#
# SonarCloud full analysis runs separately in sonarcloud.yml (windows-latest,
# requires JDK 17, runs only on develop pushes and PRs).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: Build → Test → Coverage HTML ──────────────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/STRIDE.sln

      - name: Build
        run: dotnet build backend/STRIDE.sln --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test backend/STRIDE.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory backend/TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/TestResults/**/*.trx

      # ReportGenerator — HTML coverage report uploaded as a browsable artifact
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            "-reports:backend/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:backend/TestResults/CoverageReport" \
            "-reporttypes:Html;HtmlSummary;Badges;TextSummary" \
            "-assemblyfilters:+STRIDE.*;-*.Tests" \
            "-classfilters:-*Migrations*;-*ModelSnapshot*;-*DbContextFactory*" \
            "-verbosity:Warning"

      - name: Print coverage summary
        run: |
          if [ -f backend/TestResults/CoverageReport/Summary.txt ]; then
            echo "=== Coverage Summary ==="
            grep -E "Line coverage|Branch coverage|Method coverage" \
              backend/TestResults/CoverageReport/Summary.txt
          fi

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: backend/TestResults/CoverageReport/

  # ── Frontend: Build ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: ./node_modules/.bin/ng build --configuration=production

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: Build → Test → Coverage → SonarCloud ──────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full git history for blame annotations
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/STRIDE.sln

      - name: Build
        run: dotnet build backend/STRIDE.sln --no-restore --configuration Release

      # ── Tests + Coverage ────────────────────────────────────────────────────
      - name: Test with coverage
        run: |
          dotnet test backend/STRIDE.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory backend/TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/TestResults/**/*.trx

      # ── ReportGenerator: HTML coverage report ───────────────────────────────
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            "-reports:backend/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:backend/TestResults/CoverageReport" \
            "-reporttypes:Html;HtmlSummary;Badges;TextSummary" \
            "-assemblyfilters:+STRIDE.*;-*.Tests" \
            "-classfilters:-*Migrations*;-*ModelSnapshot*;-*DbContextFactory*" \
            "-verbosity:Warning"

      - name: Print coverage summary
        run: |
          if [ -f backend/TestResults/CoverageReport/Summary.txt ]; then
            echo "=== Coverage Summary ==="
            cat backend/TestResults/CoverageReport/Summary.txt | grep -E "Line coverage|Branch coverage|Method coverage"
          fi

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: backend/TestResults/CoverageReport/

      # ── SonarCloud analysis (skipped if SONAR_TOKEN not configured) ─────────
      - name: SonarCloud — Install scanner
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud — Begin analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Ramki-Mario_Stride" \
            /o:"ramki-mario" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="backend/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.cobertura.reportsPaths="backend/TestResults/**/coverage.cobertura.xml" \
            /d:sonar.cs.vstest.reportsPaths="backend/TestResults/**/*.trx" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/*.Designer.cs,**/*ModelSnapshot.cs,**/Migrations/**"
        working-directory: backend

      - name: SonarCloud — Build (Sonar needs its own build)
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet build backend/STRIDE.sln --configuration Release

      - name: SonarCloud — End analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        working-directory: backend

  # ── Frontend: Build ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration=production

name: Deploy

# Runs on every push to develop after CI passes.
# Builds Docker images for Host + BFF and deploys to Fly.io.
# Vercel auto-deploys the Angular SPA on every push (no step needed here).

on:
  push:
    branches: [develop]

concurrency:
  group: deploy
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  # ── Deploy STRIDE.Host ────────────────────────────────────────────────────────
  deploy-host:
    name: Deploy Host
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy stride-host
        run: flyctl deploy --config fly-host.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy STRIDE.BFF ─────────────────────────────────────────────────────────
  deploy-bff:
    name: Deploy BFF
    needs: deploy-host   # Host must be healthy before BFF is updated
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy stride-bff
        run: flyctl deploy --config fly-bff.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Smoke test ────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke test
    needs: [deploy-host, deploy-bff]
    runs-on: ubuntu-latest

    steps:
      - name: Health check — Host
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stride-host.fly.dev/health/live)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1

      - name: Health check — BFF
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stride-bff.fly.dev/health)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1

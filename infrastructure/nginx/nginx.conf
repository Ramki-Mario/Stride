# ── STRIDE nginx reverse-proxy config ─────────────────────────────────────────
#
# Purpose
# -------
# In development, Angular's `ng serve` uses proxy.conf.json to forward
# /bff/* requests to STRIDE.BFF (localhost:5000).  That file only works
# with the webpack/esbuild dev server and is ignored in production builds.
#
# In production the Angular SPA is compiled to static files.  THIS file
# takes over: nginx serves the static files AND reverse-proxies /bff/* to
# the BFF container, replicating exactly what proxy.conf.json does locally.
#
# Deployment mapping
# ------------------
#   proxy.conf.json   → dev only  (ng serve)
#   nginx/nginx.conf  → all other environments (Docker, Azure, etc.)
#
# Usage (Docker Compose)
# ----------------------
#   The `stride-frontend` service in docker-compose.yml mounts this file
#   and serves the Angular build output from /usr/share/nginx/html.
#   See docker/stride-frontend/Dockerfile for the multi-stage build.
#
# Environment variables
# ---------------------
#   BFF_HOST  — hostname/IP of STRIDE.BFF (default: stride-bff)
#   BFF_PORT  — port of STRIDE.BFF        (default: 5000)
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstream: STRIDE.BFF ──────────────────────────────────────────────────
    upstream stride_bff {
        # BFF service name as defined in docker-compose.yml.
        # Override BFF_HOST / BFF_PORT via environment substitution if needed.
        server stride-bff:5000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── /bff/* → STRIDE.BFF ──────────────────────────────────────────────
        # This is the production equivalent of proxy.conf.json.
        # ALL /bff requests are forwarded to the BFF; Angular never serves them.
        location /bff/ {
            proxy_pass         http://stride_bff;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward cookies unchanged — required for stride.session HttpOnly cookie.
            proxy_pass_header  Set-Cookie;

            # Prevent nginx buffering from interfering with streaming responses.
            proxy_buffering    off;
        }

        # ── Angular SPA — HTML5 pushState routing ─────────────────────────────
        # All non-/bff/ requests that don't match a real file fall through to
        # index.html so Angular's router handles the URL client-side.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header Referrer-Policy        "strict-origin" always;
    }
}

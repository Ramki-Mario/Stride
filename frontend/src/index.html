<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>STRIDE</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="STRIDE — Smart Task Routing, Integration &amp; Distributed Execution" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Inter font — variable weight, subsetting for Latin -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"
  />

  <!-- Prevent flash of wrong theme/palette — reads localStorage before Angular boots -->
  <script>
    (function () {
      // ── Theme mode ──────────────────────────────────────────────────────
      var storedMode = null;
      try { storedMode = localStorage.getItem('stride-theme'); } catch (_) {}
      var mode =
        storedMode === 'dark' || storedMode === 'light'
          ? storedMode
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      document.documentElement.setAttribute('data-theme', mode);

      // ── Colour palette ──────────────────────────────────────────────────
      var storedPalette = null;
      try { storedPalette = localStorage.getItem('stride-palette'); } catch (_) {}
      if (storedPalette === 'purple') {
        document.documentElement.setAttribute('data-palette', 'purple');
      }
      // Indigo is the default — no attribute needed (keeps HTML clean).
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

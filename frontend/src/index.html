<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>STRIDE</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="STRIDE — Smart Task Routing, Integration &amp; Distributed Execution" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#B97AF9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STRIDE" />

  <!-- DM Sans font is self-hosted via @fontsource-variable/dm-sans (imported in styles.scss) -->

  <!-- Prevent flash of wrong theme/palette — reads localStorage before Angular boots -->
  <script>
    (function () {
      // ── Theme mode ──────────────────────────────────────────────────────
      var storedMode = null;
      try {
        storedMode = localStorage.getItem('stride-theme');
      } catch (e) {
        console.warn('Unable to read theme preference from localStorage:', e);
      }
      var osTheme = (globalThis.matchMedia && globalThis.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      var mode = (storedMode === 'dark' || storedMode === 'light') ? storedMode : osTheme;
      document.documentElement.dataset['theme'] = mode;

      // ── Colour palette ──────────────────────────────────────────────────
      // Purple is the new official default — no attribute needed.
      // Indigo is the alternative and requires data-palette="indigo".
      var storedPalette = null;
      try {
        storedPalette = localStorage.getItem('stride-palette');
      } catch (e) {
        console.warn('Unable to read palette preference from localStorage:', e);
      }
      if (storedPalette === 'indigo') {
        document.documentElement.dataset['palette'] = 'indigo';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

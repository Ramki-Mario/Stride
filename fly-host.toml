# Fly.io configuration for STRIDE.Host
# Deploy: flyctl deploy --config fly-host.toml
#
# NO public ingress — Host is private-only.
# Reachable from within the Fly.io organisation via private networking:
#   http://stride-host.internal:8080
# The BFF calls this URL. Zero public surface area on the Host.
app            = "stride-host"
primary_region = "iad"

[build]
  dockerfile    = "docker/stride-host/Dockerfile"
  build-context = "."

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:8080"
  # Secrets (set via: flyctl secrets set --app stride-host KEY=value)
  # CONNECTIONSTRINGS__DEFAULTCONNECTION  — Azure SQL connection string
  # REDIS__CONNECTIONSTRING               — Upstash Redis TLS connection string
  # JWT__SECRET                           — signing key (32+ chars)
  # JWT__ISSUER                           — https://api.strydesuite.com
  # JWT__AUDIENCE                         — https://api.strydesuite.com
